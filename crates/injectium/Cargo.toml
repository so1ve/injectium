[package]
name = "injectium"
description = "Minimal dependency-injection implementation for Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["derive", "sync"]
derive = ["dep:injectium-macro"]
sync = []
debug = ["injectium-core/debug"]
validation = ["injectium-core/validation"]

[dependencies]
injectium-core.workspace = true
injectium-macro = { workspace = true, optional = true }
