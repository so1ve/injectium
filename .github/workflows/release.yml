name: Release

on:
  push:
    branches: [main]

jobs:
  release-pr:
    name: Create Release PR
    uses: rayxiom/workflows/.github/workflows/rust-release.yml@v1
    permissions:
      pull-requests: write
      contents: write
    with:
      command: release-pr

  release:
    name: Release
    uses: rayxiom/workflows/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      command: release
